<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FAILTECH Colony Command</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2712%27 fill=%27%23160f04%27 stroke=%27%23ff9f1c%27 stroke-width=%273%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%274%27 fill=%27%23ff9f1c%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand">FAILTECH</div>
    <div class="chip"><span class="label">Credits</span><span class="v num" id="c-credits">–</span></div>
    <div class="chip"><span class="label">Population</span><span class="v num" id="c-pop">–</span></div>
    <div class="chip"><span class="label">Crew</span><span class="v num" id="c-crew">–</span></div>
    <div class="chip"><span class="label">Morale</span><span class="v num" id="c-morale">–</span><div class="meter"><i id="c-morale-bar"></i></div></div>
    <div class="chip"><span class="label">Collapse in</span><span class="v num" id="c-doom">–</span></div>
    <div class="chip"><span class="label">Power grid</span><span class="v num" id="c-energy">–</span><div class="meter"><i id="c-energy-bar"></i></div></div>
    <div class="chip"><span class="label">Convoy</span><span class="v num" id="c-convoy">–</span></div>
    <div class="chip"><span class="label">Tick</span><span class="v num" id="c-tick">–</span></div>
    <div class="spacer"></div>
    <span class="dim" id="c-user"></span>
    <button class="icon-btn" id="menu-btn" title="Settings" aria-label="Settings"></button>
  </header>
  <div id="layout">
    <aside id="left" class="side">
      <h2 class="label" id="res-title">Resource cache</h2>
      <div id="resources"></div>
      <div id="oside" style="display:none"></div>
    </aside>
    <main id="map">
      <svg id="radar" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" role="application" aria-label="Colony radar map"></svg>
      <div class="dswitch" id="dswitch"></div>
      <div class="map-alert" id="alerts"></div>
      <div class="map-hint">Click a slot to build &middot; click a structure to inspect &middot; Esc to deselect</div>
      <div class="legend" id="legend"></div>
    </main>
    <aside id="right" class="side">
      <div class="tabs" role="tablist" id="tabs"></div>
      <div id="panel"></div>
    </aside>
  </div>
  <footer id="queue"></footer>
</div>
<div id="toasts" aria-live="polite"></div>
<script src="/js/icons.js"></script>
<script src="/js/terms.js"></script>
<script src="/js/story.js"></script>
<script src="/js/orbit.js"></script>
<script src="/js/game.js"></script>
</body>
</html>
