<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FAILTECH Colony Command</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2712%27 fill=%27%23160f04%27 stroke=%27%23ff9f1c%27 stroke-width=%273%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%274%27 fill=%27%23ff9f1c%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand">FAILTECH</div>
    <div class="vitals" id="v-colony">
      <div class="chip"><span class="label">Credits</span><span class="v num" id="c-credits">–</span></div>
      <div class="chip"><span class="label">People</span><span class="v num" id="c-pop">–</span></div>
      <div class="chip"><span class="label">Cohesion</span><span class="v num" id="c-morale">–</span><div class="meter"><i id="c-morale-bar"></i></div></div>
      <div class="chip"><span class="label">Collapse in</span><span class="v num" id="c-doom">–</span></div>
      <div class="chip"><span class="label">Hazard in</span><span class="v num" id="c-hazard">–</span><div class="meter"><i id="c-hazard-bar"></i></div></div>
    </div>
    <div class="vsep" aria-hidden="true"></div>
    <div class="vitals" id="v-place"></div>
    <div class="spacer"></div>
    <div id="net"></div>
    <button class="icon-btn" id="bell-btn" title="Notifications" aria-label="Notifications"></button>
    <button class="icon-btn" id="mail-btn" title="Messages" aria-label="Messages"></button>
    <button class="user-btn" id="menu-btn" title="Command menu" aria-label="Command menu"><span id="c-user"></span></button>
  </header>
  <div id="layout">
    <nav id="rail" aria-label="Places"><div class="dswitch" id="dswitch"></div></nav>
    <main id="map">
      <svg id="radar" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" role="application" aria-label="Colony radar map"></svg>
      <div class="legend" id="legend"></div>
    </main>
    <aside id="right"><div id="panel"></div></aside>
    <section id="sheet" hidden aria-label="Workspace">
      <div class="sheet-head">
        <div class="sheet-tabs" id="sheet-tabs" role="tablist"></div>
        <button class="icon-btn" id="sheet-close" title="Close (Esc)" aria-label="Close workspace">&times;</button>
      </div>
      <div class="sheet-body" id="sheet-body"></div>
    </section>
  </div>
  <footer id="dock">
    <div class="dock-groups" id="dock-groups"></div>
    <div id="queue"></div>
  </footer>
</div>
<div id="pop" hidden></div>
<div id="toasts" aria-live="polite"></div>
<script src="/js/icons.js"></script>
<script src="/js/terms.js"></script>
<script src="/js/story.js"></script>
<script src="/js/orbit.js"></script>
<script src="/js/game.js"></script>
</body>
</html>
