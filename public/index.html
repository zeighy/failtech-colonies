<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FAILTECH Radial Command</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2712%27 fill=%27%23160f04%27 stroke=%27%23ff9f1c%27 stroke-width=%273%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%274%27 fill=%27%23ff9f1c%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="login-wrap">
  <form class="login-card" id="form" autocomplete="on" novalidate>
    <div class="brand">FAILTECH</div>
    <div class="brand-sub">Radial Command &middot; Territory Uplink</div>
    <div class="form-note warn" id="notice" hidden></div>
    <div class="seg" role="tablist" id="tabs">
      <button type="button" role="tab" id="t-login" aria-selected="true">Sign in</button>
      <button type="button" role="tab" id="t-reg" aria-selected="false">New commander</button>
    </div>
    <div class="step-title" id="step" hidden></div>
    <label class="field" data-in="login register forgot"><span class="label" id="l-user">Callsign</span>
      <input name="username" id="username" autocomplete="username" maxlength="254" required autofocus></label>
    <label class="field" data-in="register email change"><span class="label">Email</span>
      <input name="email" id="email" type="email" autocomplete="email" maxlength="254"></label>
    <label class="field" data-in="login register change reset"><span class="label" id="l-pass">Passcode</span>
      <input name="password" id="password" type="password" autocomplete="current-password" maxlength="100"></label>
    <label class="field" data-in="verify reset totp"><span class="label">Code</span>
      <input name="code" id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}"></label>
    <div class="turnstile" id="ts" data-in="login register forgot" hidden></div>
    <div class="form-error" id="error" role="alert"></div>
    <div class="form-note" id="info" role="status"></div>
    <button class="btn primary block" id="submit" type="submit">Enter command</button>
    <div class="login-links" id="links"></div>
    <div class="login-foot">The wastes don't care about your feelings. Keep the lights on, the water clean and the people fed.</div>
  </form>
</div>
<script src="/js/login.js"></script>
</body>
</html>
