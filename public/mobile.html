<!doctype html>
<html lang="en" data-shell="mobile">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12171c">
<meta name="mobile-web-app-capable" content="yes">
<title>FAILTECH Colony Command</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2712%27 fill=%27%23160f04%27 stroke=%27%23ff9f1c%27 stroke-width=%273%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%274%27 fill=%27%23ff9f1c%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/mobile.css">
</head>
<body>
<!-- The phone layout: the same game and the same screens as game.html, in a shell built for one hand.
     A place button and the alerts on top, the map with a panel under it, and five fixed tabs at the bottom. -->
<div id="app">
  <header id="topbar">
    <button class="place-btn" id="place-btn" data-act="drawer" data-d="places" aria-label="Switch place"></button>
    <div class="spacer"></div>
    <div id="net"></div>
    <button class="icon-btn" id="bell-btn" title="Notifications" aria-label="Notifications"></button>
    <button class="icon-btn" id="mail-btn" title="Messages" aria-label="Messages"></button>
  </header>
  <div class="vitals" id="vitals"></div>
  <div id="layout">
    <main id="map">
      <svg id="radar" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" role="application" aria-label="Colony radar map"></svg>
      <div class="zoomctl" id="zoomctl"></div>
    </main>
    <aside id="right">
      <button id="grab" data-act="grab" aria-label="Resize the panel"><i></i></button>
      <div id="panel"></div>
    </aside>
    <section id="sheet" hidden aria-label="Workspace">
      <div class="sheet-head">
        <button class="icon-btn" id="sheet-close" aria-label="Back to the map"></button>
        <div class="sheet-tabs" id="sheet-tabs"></div>
      </div>
      <div class="sheet-body" id="sheet-body"></div>
    </section>
  </div>
  <nav id="nav" aria-label="Screens"></nav>
</div>
<div id="drawer" hidden></div>
<div id="pop" hidden></div>
<div id="toasts" aria-live="polite"></div>
<script src="/js/icons.js"></script>
<script src="/js/terms.js"></script>
<script src="/js/story.js"></script>
<script src="/js/orbit.js"></script>
<script src="/js/minigame.js"></script>
<script src="/js/game.js"></script>
</body>
</html>
